<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor | Campus Card</title>
<meta name="theme-color" content="#2c33f0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c33f0'/%3E%3Cg fill='none' stroke='white' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 22a4 4 0 0 1 4 4'/%3E%3Cpath d='M6 15a11 11 0 0 1 11 11'/%3E%3Cpath d='M6 8a18 18 0 0 1 18 18'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<main class="wrap narrow">
  <div id="login"></div>

  <div id="dash" hidden>
    <header class="top">
      <span class="brand" id="who">Vendor</span>
      <span class="spacer"></span>
      <button class="btn sm ghost" id="out" type="button">Sign out</button>
    </header>

    <section class="screen idle" id="panel" aria-live="polite"></section>

    <div class="row between" style="margin:14px 2px 0">
      <span class="small muted" id="term"></span>
      <span class="small muted">Collected <b class="num" id="bal" style="color:var(--ink)"></b></span>
    </div>

    <form id="cf" autocomplete="off">
      <div class="amtbox"><span class="cur">&#8377;</span>
        <input id="amt" type="text" inputmode="none" maxlength="4" placeholder="0" aria-label="Amount in rupees" autocomplete="off">
      </div>
      <div class="keypad" id="keys">
        <button class="key" type="button" data-k="1">1</button><button class="key" type="button" data-k="2">2</button><button class="key" type="button" data-k="3">3</button>
        <button class="key" type="button" data-k="4">4</button><button class="key" type="button" data-k="5">5</button><button class="key" type="button" data-k="6">6</button>
        <button class="key" type="button" data-k="7">7</button><button class="key" type="button" data-k="8">8</button><button class="key" type="button" data-k="9">9</button>
        <button class="key fn" type="button" data-k="C" aria-label="Clear">Clear</button><button class="key" type="button" data-k="0">0</button><button class="key fn" type="button" data-k="B" aria-label="Delete last digit">Delete</button>
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn primary" id="go" type="submit" style="flex:2">Charge</button>
        <button class="btn" id="cancel" type="button" style="flex:1" disabled>Cancel</button>
      </div>
    </form>

    <section class="group">
      <h2>Recent sales</h2>
      <div class="panel"><ul class="list" id="sales"></ul></div>
    </section>
  </div>
</main>

<script src="/static/common.js"></script>
<script>
let stop = null, maxTtl = {}, maxTxn = 500, hasTerminal = false;

function showLogin() {
  if (stop) { stop(); stop = null; }
  $("#dash").hidden = true;
  $("#login").hidden = false;
  mountLogin({ role: "vendor", title: "Sign in", hint: "Use your vendor name and PIN.",
               identLabel: "Vendor name", onDone: showDash });
}

function showDash() {
  $("#login").hidden = true;
  $("#login").innerHTML = "";
  $("#dash").hidden = false;
  if (stop) stop();
  stop = every(1000, refresh);
}

async function refresh() {
  let me;
  try { me = await call("vendor", "/api/vendor/me"); }
  catch (e) { if (e instanceof AuthError) showLogin(); throw e; }
  render(me);
}

function setPanel(cls, html) {
  const p = $("#panel");
  p.className = "screen " + cls;
  p.innerHTML = html;
}

function render(me) {
  maxTxn = me.max_txn;
  $("#who").textContent = me.name;
  $("#bal").textContent = rupees(me.balance);
  hasTerminal = !!me.device;
  $("#term").innerHTML = me.device
    ? `<span class="row" style="gap:8px"><span class="dot ${me.device.online ? "on" : ""}"></span>Reader <span class="mono">${esc(me.device.id)}</span> ${me.device.online ? "online" : "offline"}</span>`
    : "No reader assigned. Ask the admin to assign one.";
  $("#go").disabled = !hasTerminal;

  const ch = me.charge;
  $("#cancel").disabled = !(ch && ch.status === "armed");
  if (!ch) {
    setPanel("idle", '<div class="state">Ready</div><div class="sub">Enter an amount and press Charge.</div>');
  } else if (ch.status === "armed") {
    maxTtl[ch.id] = Math.max(maxTtl[ch.id] || 0, ch.ttl);
    const pct = Math.max(0, Math.min(100, (ch.ttl / (maxTtl[ch.id] || 30)) * 100));
    setPanel("armed", `<div class="ring" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="fig-amount">${rupeesHtml(ch.amount)}</div>
      <div class="sub">Waiting for the student to tap, <span class="num">${Math.ceil(ch.ttl)}s</span> left</div>
      <div class="progress ${ch.ttl < 8 ? "warn" : ""}"><i style="width:${pct}%"></i></div>`);
  } else if (ch.status === "completed") {
    const s = me.sales && me.sales[0];
    setPanel("ok", `<div class="fig-amount">${rupeesHtml(ch.amount)}</div><div class="state">Paid</div><div class="sub">${s ? "from " + esc(s.student) : ""}</div>`);
  } else if (ch.status === "expired") {
    setPanel("bad", `<div class="state">Charge expired</div><div class="sub">${rupees(ch.amount)} was not paid in time.</div>`);
  } else {
    setPanel("idle", `<div class="state">Cancelled</div><div class="sub">${rupees(ch.amount)}</div>`);
  }

  const ul = $("#sales");
  ul.innerHTML = me.sales.length ? me.sales.map((s) =>
    `<li><div class="what"><div><b>${esc(s.student)}</b></div><div class="small muted">${esc(fmtTime(s.ts))}</div></div>
     <span class="plus num">+${rupees(s.amount)}</span></li>`).join("") : '<li class="muted">No sales yet.</li>';
}

$("#out").addEventListener("click", () => logout("vendor", showLogin));

function pressKey(k) {
  const el = $("#amt");
  if (k === "C") el.value = "";
  else if (k === "B") el.value = el.value.slice(0, -1);
  else if (/^\d$/.test(k) && el.value.length < 4) el.value = (el.value + k).replace(/^0+(?=\d)/, "");
}
$("#keys").addEventListener("click", (ev) => { const b = ev.target.closest("[data-k]"); if (b) pressKey(b.dataset.k); });
$("#amt").addEventListener("input", (ev) => { ev.target.value = ev.target.value.replace(/\D/g, "").slice(0, 4).replace(/^0+(?=\d)/, ""); });

$("#cf").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const amount = Number($("#amt").value);
  if (!Number.isInteger(amount) || amount < 1 || amount > maxTxn) {
    toast("Enter a whole amount from 1 to " + maxTxn, true);
    return;
  }
  const b = $("#go"); b.disabled = true;
  try { await call("vendor", "/api/vendor/charge", "POST", { amount }); $("#amt").value = ""; await refresh(); }
  catch (e) { toast(e.message, true); }
  finally { b.disabled = !hasTerminal; }
});

$("#cancel").addEventListener("click", async () => {
  try { await call("vendor", "/api/vendor/charge/cancel", "POST"); await refresh(); }
  catch (e) { toast(e.message, true); }
});

if (store.get("campus.token.vendor")) showDash(); else showLogin();
</script>
</body>
</html>
